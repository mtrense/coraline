name: CI

on:
  push:
  pull_request:
    branches: [main]

# Least privilege: nothing in CI writes back to the repo or a registry.
permissions:
  contents: read

# Supersede in-flight runs for the same ref, but never cancel a run on `main`
# (post-merge runs are the record of what landed).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain publishes no semver tags: `stable` is a branch that has
      # diverged from `master`, so a SHA pinned from it can be garbage-collected. Pin
      # `master` and pick the toolchain via the `toolchain:` input instead of via the ref.
      # Do not "fix" this back to `@stable`.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master @ 2026-10-08
        with:
          toolchain: stable
          components: rustfmt, clippy
      # Only `main` writes the cache; branches and PRs restore from it but cannot poison it.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      # Report every failing crate, not just the first.
      - run: cargo test --workspace --no-fail-fast
      - run: cargo test --workspace --all-features --no-fail-fast

  platforms:
    # `cfg(windows)` / macOS-specific paths are neither compiled nor tested on Linux.
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # See the note in the `check` job: master + `toolchain:` input, not `@stable`.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master @ 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo test --workspace --no-fail-fast

  docs:
    name: docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # See the note in the `check` job: master + `toolchain:` input, not `@stable`.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master @ 2026-10-08
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo doc --workspace --all-features --no-deps
        env:
          RUSTDOCFLAGS: -D warnings

  msrv:
    # Proves the minimum supported Rust version is honest: if a dependency bump or a
    # new language feature raises the real floor, this job fails instead of a user's build.
    name: msrv (1.96)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # See the note in the `check` job: master + `toolchain:` input, not `@stable`.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master @ 2026-10-08
        with:
          toolchain: "1.96"
      # rust-cache derives the cache key from the active toolchain, so this does not
      # collide with the stable jobs above.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # `--locked` so the committed Cargo.lock is what gets validated.
      - run: cargo check --workspace --all-targets --all-features --locked

  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Deliberately not EmbarkStudios/cargo-deny-action: it is a Docker action that
      # rebuilds from a Dockerfile with a floating base image, so pinning its SHA pins
      # nothing that actually executes. install-action fetches a checksummed prebuilt binary.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-deny
      - run: cargo deny check
