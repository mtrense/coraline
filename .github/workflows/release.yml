name: Release

on:
  push:
    # Strict three-part semver only. `+` is GitHub's filter-pattern "one or more of the
    # preceding character", so this matches v1.2.3 but deliberately not v1.0.0-rc.1.
    tags: ['v[0-9]+.[0-9]+.[0-9]+']

# Read-only by default; only the publish job gets `contents: write`.
permissions:
  contents: read

# Serialise runs per tag but never cancel one: a half-cancelled run can leave a
# Release with only some of the archives attached.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  verify:
    name: verify tag and version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Runs before the build matrix so a bad tag fails in seconds rather than after
      # seven builds. `cargo metadata --no-deps` reads manifests only; it compiles nothing.
      - name: Resolve and cross-check the version
        id: version
        run: |
          set -euo pipefail
          manifest="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "coraline") | .version')"
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          if [ "$version" != "$manifest" ]; then
            echo "error: tag '$tag' implies version '$version' but crates/coraline/Cargo.toml is '$manifest'" >&2
            exit 1
          fi
          echo "tag $tag matches Cargo.toml version $manifest"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  build:
    name: build ${{ matrix.target }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      # One broken target must not hide the state of the others.
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            cross: false
            features: ""
          # Native arm runner, so the default (bundled onnxruntime) build works without cross.
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
            cross: false
            features: ""
          # Static musl builds go through cross; onnxruntime has no musl prebuilt, so the
          # embedding runtime is loaded dynamically at run time instead of bundled.
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            features: --no-default-features --features embeddings-dynamic
          - target: aarch64-unknown-linux-musl
            os: ubuntu-latest
            cross: true
            features: --no-default-features --features embeddings-dynamic
          - target: aarch64-apple-darwin
            os: macos-latest
            cross: false
            features: ""
          # ort ships no prebuilt onnxruntime for Intel macOS; load it dynamically.
          - target: x86_64-apple-darwin
            os: macos-latest
            cross: false
            features: --no-default-features --features embeddings-dynamic
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            cross: false
            features: ""
    # No rust-cache here: a release artifact must not be built from a cache an earlier
    # (possibly untrusted) run could have written.
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # dtolnay/rust-toolchain publishes no semver tags and its `stable` branch has
      # diverged from master, so the action is pinned to a master SHA and the toolchain
      # is selected through the `toolchain:` input instead of through the ref.
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master @ 2026-10-08
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      # cross ships x86_64 host binaries only, which is why every cross entry runs on
      # ubuntu-latest; Docker is already up there.
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        if: matrix.cross
        with:
          tool: cross

      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          cargo_cmd=cargo
          if [ "${{ matrix.cross }}" = "true" ]; then cargo_cmd=cross; fi
          $cargo_cmd build --release --locked --bin coraline --target '${{ matrix.target }}' ${{ matrix.features }}

      - name: Stage archive
        id: stage
        shell: bash
        run: |
          set -euo pipefail
          version='${{ needs.verify.outputs.version }}'
          target='${{ matrix.target }}'
          name="coraline-${version}-${target}"

          bin=coraline
          case "$target" in *-windows-*) bin=coraline.exe ;; esac

          mkdir -p "dist/$name"
          cp "target/$target/release/$bin" README.md LICENSE-MIT LICENSE-APACHE "dist/$name/"

          cd dist
          case "$target" in
            *-windows-*)
              # 7z is preinstalled on the Windows runners; git-bash has no `zip`.
              archive="$name.zip"
              7z a -tzip "$archive" "./$name/*" > /dev/null
              ;;
            *)
              archive="$name.tar.gz"
              # COPYFILE_DISABLE keeps macOS bsdtar from smuggling `._*` metadata entries in.
              COPYFILE_DISABLE=1 tar -czf "$archive" -C "$name" .
              ;;
          esac
          echo "archive=dist/$archive" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: archive-${{ matrix.target }}
          path: ${{ steps.stage.outputs.archive }}
          if-no-files-found: error

  publish:
    name: publish release
    needs: [verify, build]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: archive-*
          merge-multiple: true

      # Standard `sha256sum` output so consumers can run `sha256sum -c checksums.txt`.
      - name: Generate checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum coraline-* > checksums.txt
          cat checksums.txt

      # Extracts the Keep-a-Changelog section for the released version (from `## [X.Y.Z]`
      # up to the next `## `). Falls back to GitHub's auto-generated notes if missing.
      - name: Extract release notes
        id: notes
        run: |
          set -euo pipefail
          version='${{ needs.verify.outputs.version }}'
          awk -v ver="$version" '
            $0 ~ "^## \\[" ver "\\]" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "found CHANGELOG.md section for $version"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "no CHANGELOG.md section for $version; using auto-generated notes"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: dist/*
          body_path: ${{ steps.notes.outputs.generate == 'false' && 'release-notes.md' || '' }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}
          fail_on_unmatched_files: true
